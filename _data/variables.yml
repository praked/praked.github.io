---
  root_font_size: 15 #px
  root_font_size_medium: 16 #px
  root_font_size_large: 17 #px

  root_font_size_print: 8 #pt

  root_line_height: 1.75

  font_weight: 400 #=normal
  font_weight_bold: 700 #=bold
  font_weight_heading: 900 #=black (heavy)

  content_width: 42 #rem
  content_width_2: 48 #rem
  # Widened from the theme default of 54rem: on large screens the layout left a
  # ~20rem column empty on the right, since that space is reserved for the table
  # of contents and almost no page here has one.
  # NOTE: `break_point_dynamic` is derived from this value
  # (content_width_5 + 2*content_margin_5 + 2*sidebar_width), so raising it also
  # raises the width at which the TOC moves into the right column. No overlap.
  content_width_5: 64 #rem

  sidebar_width: 21 #rem
  border_radius: 0.5 #rem

  break_point_1: 42 #em
  break_point_2: 54 #em
  break_point_3: 64 #em
  break_point_4: 72 #em
  break_point_5: 86 #em
  break_point_font_large: 124 #em
