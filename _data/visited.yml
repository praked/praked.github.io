# Countries Pranav has visited, drawn on the world map on /misc/
# (_includes/travel-map.html). Add a line to colour another country in.
#
#   code: ISO 3166-1 alpha-2, lowercase (the data-c values in
#         _includes/world-map-paths.svg). QUOTE "no" (Norway): unquoted,
#         YAML reads it as the boolean false.
#   name: shown in the list under the map
#   also: optional extra map codes coloured with it (e.g. an overseas
#         territory drawn separately); not counted or listed
#   dot:  optional [x, y] on the map, for countries too small to see
#         (drawn as a small accent circle)

