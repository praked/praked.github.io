# News / updates timeline, rendered by _includes/news.html on the homepage.
#
# Migrated out of index.md, where these were 19 hand-written
# <p align="justify"> blocks interleaved with YouTube iframes.
#
#   date:  full ISO date (YYYY-MM-DD). Only month and year are displayed; the
#          day exists so sorting and year-grouping work. Where the original
#          gave only a month, the 1st is used.
#   text:  the entry. Inline HTML links are allowed and rendered as-is.
#   kind:  optional label — grant | paper | press | position | talk | thesis
#   videos: optional list of YouTube videos, embedded under the entry.
#          Each has an `id` and an optional `start` offset in seconds.
#          The players are lazy-loaded, so they cost nothing until
#          scrolled to.
#   image: optional photo, shown under the entry.

- date: 2024-05-01
  kind: grant
  text: >
    Awarded a travel grant for the 'Maritime Informatics &amp; Robotics'
    summer school.

- date: 2024-04-01
