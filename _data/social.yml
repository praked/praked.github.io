# Social platforms, resolved by _includes/social.html.
#
# Trimmed from ~90 entries to the six that _data/authors.yml actually
# uncomments. Nothing else was reachable: the include iterates
# `authors.yml -> author1.social`, so an entry here with no counterpart there
# renders nothing.
#
#   name:    accessible label (icon-only links need one)
#   sprite:  symbol id in _includes/icons.svg
#   prepend: glued in front of the username — skipped when the value in
#            authors.yml is already a full URL (contains "//")
#
# The resulting hrefs must stay byte-identical to the old theme's output;
# these are links people have shared.

twitter:
  name: X / Twitter
  sprite: i-xtwitter
  prepend: 'https://x.com/'

bluesky_url:
  name: Bluesky
  sprite: i-bluesky

google-scholar:
  name: Google Scholar
  sprite: i-googlescholar

research-gate:
  name: ResearchGate
  sprite: i-researchgate

youtube:
  name: YouTube
  sprite: i-youtube
  prepend: 'https://www.youtube.com/channel/'

linkedin:
  name: LinkedIn
  sprite: i-linkedin
  prepend: 'https://www.linkedin.com/in/'
