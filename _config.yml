# Config
# ========================================================================================

# The URL of your site (with protocol, e.g. `https://`).
# Set explicitly so local builds generate the same absolute URLs as production
# (sitemap.xml and jekyll-seo-tag). Without it, a local build has no GitHub API
# metadata and falls back to a wrong host.
url:                   https://praked.github.io

# The "base URL" of your site. Empty because this is a user page served at the
# domain root. Set explicitly for the same reason as `url` above: without it a
# local build derives a bogus '/pages/praked' prefix from missing API metadata.
baseurl:               ''


# General settings
# ---------------------------------------------------------------------------------------

# Language of your content in 2-letter code, e.g.: en, de.
# You may also provide a location, e.g.: en-us, de_AT.
lang:                  en

# The title of your blog. Used in the sidebar and the browser tab.
title:                 Pranav Kedia

description:           >
  Pranav Kedia is a Ph.D. researcher in the Cyber Physical Systems group at the
  University of Konstanz, an IIIT-Bangalore alum, and an open-hardware and FOSS enthusiast.

tagline:               FOSS and Open Hardware Creator and Enthusiast

keywords:
  - robotics
  - swarm robotics
  - autonomous sailing
  - autonomous surface vehicles
  - open hardware
  - FOSS

# A (square) logo for your site.
# If provided, it will be shown at the top of the sidebar.
# It also used by the `jekyll-seo-tag` plugin.
logo:                  /assets/img/profilepicsmall.jpg

# This should be the same author as first entry in `_data/authors.yml`.
author:
  # Used by `jekyll-feed`:
  name:                Pranav Kedia
  email:               pranavkedia11@gmail.com
  # # Used by `jekyll-seo-tag`:
  twitter:             pranavkedia11
  github:              praked

# Add links to the sidebar.
menu:
  - title:             About
    url:               /
  - title:             Projects
    url:               /projects/
  - title:             Publications
    url:               /publications/
  - title:             Talks
    url:               /talks/
  - title:             Tools
    url:               /tools/
  - title:             Curriculum Vitae
    url:               /CV/
  - title:             Leisurely amusements
    url:               /misc/    
  - title:             Get in touch
    url:               /contact/    
  

# Add links to the footer.
# Typically you'll want to link to your cookie- or privacy policy (if appliable), etc..
# LICENSE and NOTICE: site copyright and third-party credits.
# CHANGELOG was removed — it was the theme's own changelog, not site content.
legal:
  - title:             LICENSE
    url:               /LICENSE/
  - title:             NOTICE
    url:               /NOTICE/

# This text will appear in a `<small>` tag in the footer of every page.
copyright:             </> with ❤ by Pranav Kedia © 2021–2026. All rights reserved.

# Format of the permalinks
permalink:             /:categories/:year-:month-:day-:title/

# Pagination intentionally removed. `jekyll-paginate` could never work on this
# site: projects/index.html pins `permalink: /projects/`, so every generated
# pager page overwrote the same file and the "Older" link pointed at a page
# that was never built. `_layouts/grid.html` falls back to
# `site.categories.projects`, which is what has actually been rendering all
# along. Keeping `permalink: /projects/` is deliberate — it is in the URL
# contract (tools/urls-baseline.txt).


# Theme
# ---------------------------------------------------------------------------------------

# No theme. Layouts, includes and styles are site-local, in _layouts/,
# _includes/ and _sass/. Hydejack v9 used to be pulled in here via
# `remote_theme:`; it was replaced because its dark mode was a paid feature,
# it shipped 21MB of MathJax this site never used, and overriding it was
# costing more than owning the ~500 lines it has been replaced with.


# Customizaton
# ----------------------------------------------------------------------------------------
 
# Sidebar image and theme color of the site.
# NOTE: no longer read. The sidebar and cover background is now the line-art
# drawing in _includes/sailswarm-art.svg. The photo itself is kept because its
# URL is in tools/urls-baseline.txt.
accent_image:          /assets/img/blog/parusnyy-sport-regata-gonka.jpg
# accent_color:          rgb(79,177,186)

# # This is used for the `theme-color` meta tag,
# # which changes the background color of the browser UI in certain browsers.
# # Defaults to `accent_color`.
# theme_color:           rgb(25,55,71)

# Deeper teal than before (better contrast, still “marine”)
accent_color:          rgb(60,150,160)

# Keep browser UI dark and consistent with the overlay/background
theme_color:           rgb(18,45,58)

# IMPORTANT:
# As of Hydejack 9.2, Google Fonts are turned off by default due to a stronger focus on privacy.
# Hydejack will use the default font of your visitor's operating system instead.
# If you want to match the look of hydejack.com, remove the following line and uncomment 
# the font-related options below:

# The string encoding which fonts to fetch from Google Fonts.
# See: <https://hydejack.com/docs/configuration/>
# google_fonts:          Roboto+Slab:700|Noto+Sans:400,400i,700,700i

# The text font. Expects a string that is a valid CSS font-family value.
# To change font-weight, see _sass/variables.scss
font:                  Noto Sans, Helvetica, Arial, sans-serif

favicon: /assets/favicon/favicon.ico

# Google Analytics 4 measurement id. Consumed by `_includes/my-head.html`.
# NOT the theme's `google_analytics` key — that one emits the legacy, UA-only
# analytics.js, which cannot use a G- measurement id.
google_analytics_id:   G-23W34J48BH

# The font used for headings. Expects a string that is a valid CSS font-family value.
# To change font-weight, see _sass/variables.scss
# font_heading:          Roboto Slab, Helvetica, Arial, sans-serif

# The font used for code blocks. Expects a string that is a valid CSS font-family value. 
# Defaults to the [System Monospace Font Stack](https://qwtel.com/posts/software/the-monospaced-system-ui-css-font-stack/).
# font_code:             Fira Code, Menlo, Monaco, Consolas, monospace;

defaults:
  # NOTE on `path:` values — do NOT add a trailing slash.
  # Jekyll matches a scope with `path == scope` or `path.start_with?("#{scope}/")`,
  # so a scope written as `assets/` is compared against `assets//` and silently
  # matches nothing. Both scopes below used to carry a trailing slash, which is
  # why the CV/paper PDFs and the theme licence pages were still being submitted
  # in sitemap.xml despite `sitemap: false`. The `projects` scope further down
  # has always worked because it has no trailing slash.

  # Don't include documents in assets in the sitemap
  - scope:
      path:            assets
    values:
      sitemap:         false

  # Don't include licenses in sitemap (feel free to delete).
  # `noindex` as well as `sitemap: false`: dropping them from the sitemap only
  # stops them being *submitted*, it does not remove the six already-indexed
  # theme licence pages from search results.
  - scope:
      path:            licenses
    values:
      layout:          plain
      sitemap:         false
      noindex:         true

  # # You can use the following to enable comments on all posts.
  # - scope:
  #     type:            posts
  #   values:
  #     comments:        true

  # `jekyll-seo-tag` will mark collection outputs as `BlogPosting`,
  # but we want them to be `WebPage`s.
  # Project pages live in `projects/_posts/`, so Jekyll types them as `posts`
  # (not `projects`) — scope by path so this default actually matches.
  - scope:
      path:            projects
      type:            posts
    values:
      seo:
        type:          WebPage

  # Publication pages carry a `date:`, so `jekyll-seo-tag` types them as
  # `BlogPosting` — wrong for a paper, and it tells Google nothing useful.
  # `ScholarlyArticle` is the schema.org type for a published work.
  - scope:
      path:            publications
    values:
      seo:
        type:          ScholarlyArticle
  - scope:
      type:            featured_categories
    values:
      seo:
        type:          WebPage
  - scope:
      type:            featured_tags
    values:
      seo:
        type:          WebPage

# GitHub Pages forced `future: true`; Jekyll 4 defaults to false, which would
# silently drop any document dated ahead of the build clock — and take its
# path out of the URL contract with it. Several publications are future-dated.
future:                true

kramdown:
  # The classic builder ran kramdown with the GFM parser. Building with
  # Jekyll 4's default parser produced zero visible-text differences on every
  # page, so the content is insensitive to this — it is set explicitly so the
  # two parsers stay provably identical rather than coincidentally so.
  input:               GFM
  hard_wrap:           false
  syntax_highlighter:  rouge
  syntax_highlighter_opts:
    default_lang:      plaintext
  math_engine:         mathjax
  math_engine_opts:    {}
  footnote_backlink:   '&#x21a9;&#xfe0e;'


# Hydejack Settings
# ----------------------------------------------------------------------------------------
# These settings are specific to Hydejack.

# The `hydejack:` block that used to sit here configured theme features
# (push-state, drawer, search, PRO-only dark mode). All gone with the theme.

# Collections
# ----------------------------------------------------------------------------------------

collections:
  featured_categories:
    permalink:         /:name/
    output:            true

  featured_tags:
    permalink:         /tag-:name/
    output:            true


# File inclusion/exclusion
# ----------------------------------------------------------------------------------------

exclude:
  - .jekyll-cache
  - .sass-cache
  - .ruby-lsp
  - vendor
  - Gemfile
  - Gemfile.lock
  # Local tooling, not site content. `serve.sh` was being published at
  # https://praked.github.io/serve.sh; `tools/` holds the link-preservation
  # harness and the SEO baseline.
  #
  # The trailing slash on `tools/` is REQUIRED: Jekyll's exclude matching is
  # prefix based, so a bare `tools` also matches the file `tools.md` and
  # silently deletes the /tools/ page. (Note this is the opposite of the
  # `defaults:` scope rule above, where a trailing slash breaks the match.)
  - serve.sh
  - tools/
include:
  - LICENSE.md


# Plugins
# ----------------------------------------------------------------------------------------

plugins:
  - jekyll-default-layout
  - jekyll-feed
  - jekyll-optional-front-matter
  - jekyll-readme-index
  - jekyll-redirect-from
  - jekyll-relative-links
  - jekyll-seo-tag
  - jekyll-sitemap
  - jekyll-titles-from-headings
  - jekyll-include-cache
  # NOTE: `jekyll-last-modified-at` was removed. It is not on the GitHub Pages
  # plugin allowlist, so the classic Pages build silently ignored it and
  # `page.last_modified_at` was always nil in production (it only ever worked
  # in local builds). See `hide_last_modified` below.


# SEO Tag
# ---------------------------------------------------------------------------------------

# Where you proof that you own this site (used by jekyll-seo-tag).
# Moved here from an inline <meta> in the body of `index.md`, where it was both
# invalid (verification tags must be in <head>) and present on one page only.
google_site_verification: PY0HOlPg1kjKYPy20mRGw7vIBzuM-56ngFJ0pgtMOso
# -- or --
# webmaster_verifications:
#   google:              <verification-id>
#   bing:                <verification-id>
#   alexa:               <verification-id>
#   yandex:              <verification-id>

# Used for twitter cards
# twitter:
#   username:            <username>

# Used for facebook open graph
# facebook:
#   app_id:              <id>
#   publisher:           <id>
#   admins:              <id>

# Used on index and about sites
# social:
#   name:                <firstname> <lastname>
#   links:
#     - https://twitter.com/<username>
#     - https://github.com/<username>


# Plugin Configs
# ---------------------------------------------------------------------------------------
optional_front_matter:
  remove_originals:    true

readme_index:
  remove_originals:    true
  with_frontmatter:    true

relative_links:
  collections:         true

titles_from_headings:
  strip_title:         true
  collections:         true

compress_html:
  comments:            ["<!--", "-->"]
  clippings:           all
  endings:             all
  ignore:
    envs:              [development]

sass:
  style:               compressed
  # jekyll-sass-converter 3.x defaults sourcemaps to :always. Inert today only
  # because the theme compiles CSS through the `scssify` Liquid filter rather
  # than a real .scss asset — the first hand-rolled assets/css/*.scss would
  # start emitting /assets/css/*.css.map.
  sourcemap:           never

# Jekyll Compose Defaults
# ---------------------------------------------------------------------------------------

jekyll_compose:
  default_front_matter:
    drafts:
      layout: post
      description: > 
        A short ~160 character description of your post for search engines,
        social media previews, etc.
      image:
        path: /assets/img/profilepicsmall.jpg
    posts:
      layout: post
      description: > 
        A short ~160 character description of your post for search engines,
        social media previews, etc.
      image:
        path: /assets/img/profilepicsmall.jpg
    projects:
      layout: project
      description: > 
        A short ~160 character description of your post for search engines,
        social media previews, etc.
      image:
        path: /assets/img/profilepicsmall.jpg
      links:
        - title: Project Link
          url: https://example.com
