{%- comment -%}
  Inline SVG sprite, injected once as the first child of <body>.

  Replaces TWO network dependencies that every page used to carry: the
  Font Awesome kit script from kit.fontawesome.com (a render-blocking
  third-party request) and Hydejack's 288KB icomoon webfont. Only nine icons
  were ever actually rendered on this site, so a sprite is both smaller and
  faster than either.

  The six brand marks are from Simple Icons, which is CC0 — no attribution
  burden, unlike Font Awesome Free's CC BY 4.0. The three interface glyphs
  (menu, sun, moon) are drawn here. Credited in NOTICE.md regardless.
{%- endcomment -%}
