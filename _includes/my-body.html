<!-- Swiper (carousel). Pinned to match the stylesheet in `my-head.html`. -->
<script src="https://unpkg.com/swiper@11/swiper-bundle.min.js"></script>
<script>
  // Swiper 7+ uses `.swiper` as the root class (was `.swiper-container`).
  // Guarded so the script is a no-op on pages without a carousel.
  (function () {
    function initSwiper() {
      if (typeof Swiper === 'undefined') return;
      document.querySelectorAll('.swiper:not(.swiper-initialized)').forEach(function (el) {
        new Swiper(el, {
          loop: true,
          pagination: { el: el.querySelector('.swiper-pagination'), clickable: true },
          navigation: {
            nextEl: el.querySelector('.swiper-button-next'),
            prevEl: el.querySelector('.swiper-button-prev'),
          },
        });
      });
    }

    initSwiper();

    // Re-initialise after hy-push-state swaps the page content, otherwise the
    // carousel is dead on any page reached by client-side navigation.
    var pushStateEl = document.getElementById('_pushState');
    if (pushStateEl) {
      pushStateEl.addEventListener('hy-push-state-after', initSwiper);
    }
  })();
</script>

<!-- Send a GA pageview on hy-push-state navigation. The gtag snippet in
     `my-head.html` only fires on a full page load; without this, every
     client-side navigation goes unrecorded. -->
<script>
  (function () {
    var pushStateEl = document.getElementById('_pushState');
    if (!pushStateEl) return;
    pushStateEl.addEventListener('hy-push-state-after', function () {
      if (typeof gtag !== 'function') return;
      gtag('event', 'page_view', {
        page_path: location.pathname + location.search,
        page_location: location.href,
        page_title: document.title,
      });
    });
  })();
</script>
