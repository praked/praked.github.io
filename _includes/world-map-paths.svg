  (ne_10m_admin_0_countries_ind, public domain), so India is drawn with its
  official boundaries, including all of Jammu & Kashmir, Ladakh and
  Aksai Chin. Miller projection, latitudes -57 to 84, simplified.
  Regenerate with tools/make-world-map.py.

