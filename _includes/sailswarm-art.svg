{%- comment -%}
  Line-art background for the sidebar and the full-screen cover: the water,
  seen from a low camera, with a horizon and drawn wave lines.

  The boats are NOT in this file. assets/js/site.js runs a small sailing-swarm
  simulation and draws the fleet into the empty groups below, every frame:
  wind streaks, wakes, links between neighbours, the waypoint buoy, and the
  boats themselves. Without JavaScript only the water is shown.

  Everything is stroked in currentColor; colour and strength are set in
  _sass/_art.scss.
{%- endcomment -%}
<svg class="sidebar-art" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900"
     preserveAspectRatio="xMidYMid slice" aria-hidden="true" focusable="false">
  <path class="art-horizon" d="M0,345 L1600,345" fill="none" stroke="currentColor"/>
  <path class="art-wave" d="M-200,372 q25,-1.2 50,0 t50,0 t50,0 t50,0 t50,0 t50,0 t50,0 t50,0 t50,0 t50,0 t50,0 t50,0 t50,0 t50,0 t50,0 t50,0 t50,0 t50,0 t50,0 t50,0 t50,0 t50,0 t50,0 t50,0 t50,0 t50,0 t50,0 t50,0 t50,0 t50,0 t50,0 t50,0 t50,0 t50,0 t50,0 t50,0 t50,0 t50,0 t50,0 t50,0" pathLength="2000" stroke-dasharray="150 150" stroke-dashoffset="0" fill="none" stroke="currentColor" opacity="0.20"/>
