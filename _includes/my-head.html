  Injected into the document <head> by the theme.
  NOTE: do not add a <head> tag here — this content is already inside one.
-->

<!-- Google Analytics 4 (gtag.js), loaded site-wide. Id set in `_config.yml`.
     Previously this was the legacy UA tag inline in the body of `index.md`, so it
     only ever fired on homepage landings and never re-fired during hy-push-state
     navigation. Pageviews for SPA navigations are sent from `my-body.html`.
     NOTE: deliberately NOT using the theme's `google_analytics` config key —
     Hydejack's built-in analytics include uses the legacy analytics.js, which is
     Universal Analytics only and does not support a G- measurement id. -->
{% if site.google_analytics_id %}
<script async src="https://www.googletagmanager.com/gtag/js?id={{ site.google_analytics_id }}"></script>
<script>
  window.dataLayer = window.dataLayer || [];
  function gtag(){ dataLayer.push(arguments); }
  gtag('js', new Date());
  gtag('config', '{{ site.google_analytics_id }}');
</script>
{% endif %}

<!-- Font Awesome's CDN kit used to load here on every page. It is gone:
     only nine icons were ever rendered, and they now come from the inline
     sprite in `_includes/icons.svg`. That removes a render-blocking
     third-party request and the 288KB icomoon webfont with it. -->
